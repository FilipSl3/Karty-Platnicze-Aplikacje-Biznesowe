services:
  postgres-db:
    image: postgres:16-alpine
    container_name: cards_postgres
    environment:
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: bank_pass
      POSTGRES_DB: cards_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d cards_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cards-backend
    # BRAK ports: baza wyłącznie w sieci wewnętrznej (izolacja).
    # Dostęp w dev przez: docker exec -it cards_postgres psql -U bank_user -d cards_db

  card-provider:
    build:
      context: ./card-provider-service
      dockerfile: Dockerfile
    container_name: cards_provider_app
    environment:
      DATABASE_URL: "postgresql+asyncpg://bank_user:bank_pass@postgres-db/cards_db"
      GRPC_PORT: 50051
      VIRTUAL_CARD_ACTIVATION_DELAY: "60"
      PAN_ENCRYPTION_KEY: "karty-platnicze-key-2026"
      CARD_VERIFICATION_KEY: "cvk-secret-key-2026"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minio_admin"
      MINIO_SECRET_KEY: "minio_admin_2026"
      MINIO_BUCKET: "settlements"
      MINIO_RETENTION_DAYS: "1"
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - cards-backend
    # BRAK ports: gRPC (50051) i socket ISO (9000) widoczne TYLKO wewnątrz backendu.
    # Gateway łączy się przez nazwę 'card-provider' w tej samej sieci - działa bez zmian.

  payment-gateway:
    build:
      context: ./payment-gateway-service
      dockerfile: Dockerfile
    container_name: cards_gateway_app
    ports:
      - "8072:8000"
    environment:
      GRPC_SERVER_URL: "card-provider:50051"
      ADMIN_API_KEY: "admin-secret-key-2026"
    depends_on:
      - card-provider
    networks:
      - cards-frontend
      - cards-backend

  admin-panel:
    build:
      context: ./admin-panel
    container_name: cards_admin_panel
    ports:
      - "3072:3000"
    depends_on:
      - payment-gateway
    networks:
      - cards-frontend

  minio:
    image: minio/minio:latest
    container_name: cards_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_2026
    volumes:
      - minio_data:/data
    networks:
      - cards-backend

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: cards_vpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    volumes:
      - ./wireguard-config:/config
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    privileged: true
    networks:
      - cards-frontend
      - cards-backend
    restart: unless-stopped

networks:
  cards-frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  cards-backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  postgres_data:
  minio_data: