<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>POS Terminal</title>

    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            padding: 10px;
            width: 100%;
        }

        .approved {
            color: green;
            font-weight: bold;
        }

        .declined {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>POS Terminal Simulator</h1>

<form id="paymentForm">

    <input
        type="text"
        id="card_number"
        placeholder="Card Number"
        required
    >

    <input
        type="number"
        id="expiry_month"
        placeholder="Expiry Month"
        required
    >

    <input
        type="number"
        id="expiry_year"
        placeholder="Expiry Year"
        required
    >

    <input
        type="text"
        id="cvv"
        placeholder="CVV"
        required
    >

    <input
        type="number"
        step="0.01"
        id="amount"
        placeholder="Amount"
        required
    >

    <button type="submit">
        Authorize Payment
    </button>

</form>

<hr>

<div id="result"></div>

<script>

document
.getElementById("paymentForm")
.addEventListener("submit", async (e) => {

    e.preventDefault();

    const body = {
        card_number:
            document.getElementById("card_number").value,

        expiry_month:
            parseInt(
                document.getElementById("expiry_month").value
            ),

        expiry_year:
            parseInt(
                document.getElementById("expiry_year").value
            ),

        cvv:
            document.getElementById("cvv").value,

        amount:
            parseFloat(
                document.getElementById("amount").value
            ),

        currency: "PLN",
        merchant_id: "SHOP_001",
        merchant_name: "Test Shop"
    };

    const response = await fetch(
        "/api/v1/payments/authorize",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        }
    );

    const data = await response.json();

    const result =
        document.getElementById("result");

    if (!response.ok) {

        result.innerHTML =
            `<h2 class="declined">
                ERROR
            </h2>
            <p>${data.detail}</p>`;

        return;
    }

    if (data.approved) {

        result.innerHTML =
            `<h2 class="approved">
                APPROVED
            </h2>
            <p>${data.message}</p>`;

    } else {

        result.innerHTML =
            `<h2 class="declined">
                DECLINED
            </h2>
            <p>${data.message}</p>`;
    }
});

</script>

</body>
</html>
